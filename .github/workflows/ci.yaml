name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: '1.19.1'
          otp-version: '28.1.1'
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      - name: Credo
        run: mix credo --strict
      - name: Sobelow
        run: mix sobelow.apps
      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: backend/priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Dialyzer
        run: mix dialyzer --format short
      - name: Test with coverage
        run: mix coveralls.json --umbrella
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/cover/excoveralls.json
            backend/cover/*.html
          if-no-files-found: warn

  dart-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.5.1'
      - name: Test libmsgr_core
        working-directory: flutter_frontend/packages/libmsgr_core
        run: |
          dart pub get
          dart test
      - name: Test libmsgr_cli
        working-directory: flutter_frontend/packages/libmsgr_cli
        run: |
          dart pub get
          dart test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Check formatting
        run: flutter format --set-exit-if-changed lib packages test
      - name: Run Flutter tests with coverage
        run: flutter test --coverage
      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: flutter_frontend/coverage/lcov.info
          if-no-files-found: warn
    needs:
      - dart-packages

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate CI .env
        run: bash scripts/ci_integration_env.sh
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.5.1'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install -r integration_tests/requirements.txt
      - name: Run integration tests
        env:
          MSGR_INTEGRATION_TIMEOUT: '360'
        run: pytest -m integration -v --tb=short
      - name: Collect compose logs
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps > artifacts/compose-ps.txt || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color > artifacts/compose-logs.txt || true
      - name: Upload integration artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: artifacts/
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down --volumes --remove-orphans || true
