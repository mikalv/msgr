name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: '1.19.1'
          otp-version: '28.1.1'
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      - name: Credo
        run: mix credo --strict
      - name: Sobelow
        run: mix sobelow.apps
      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: backend/priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Dialyzer
        run: mix dialyzer --format short
      - name: Run tests
        env:
          MIX_ENV: test
        run: mix test

  dart-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.5.1'
      - name: Test libmsgr_core
        working-directory: flutter_frontend/packages/libmsgr_core
        run: |
          dart pub get
          dart test
      - name: Test libmsgr_cli
        working-directory: flutter_frontend/packages/libmsgr_cli
        run: |
          dart pub get
          dart test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Check formatting
        run: flutter format --set-exit-if-changed lib packages test
      - name: Run Flutter tests
        run: flutter test
    needs:
      - dart-packages
