version: "3.9"

services:
  db:
    image: postgres:15
    container_name: msgr_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: msgr_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  msgr_redis:
    image: redis:7-alpine
    container_name: msgr_redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  msgr-minio:
    image: minio/minio
    container_name: msgr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio_init:
    image: minio/mc
    container_name: msgr-minio-init
    depends_on:
      msgr-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://msgr-minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/msgr-media;
      echo 'Bucket msgr-media ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: "no"

  rust_gateway:
    build:
      context: ./rust-gateway
      dockerfile: Dockerfile
      target: prod
    container_name: msgr_rust_gateway
    environment:
      HTTP_PORT: 8443
      GRPC_PORT: 50053
      SERVER_STATIC_KEY: JPyIbVodh4N+o1F98UFcPdK3TeZ3t6VjkxTsauDiLYc=
      BACKEND_URL: http://backend:4000
      ELIXIR_GRPC_URL: http://backend:50052
      SESSION_DEFAULT_TTL_SECONDS: 3600
      SESSION_CLEANUP_INTERVAL_SECONDS: 300
      SESSION_MAX_SESSIONS: 10000
      RUST_LOG: info,rust_gateway=debug
      LOG_FORMAT: pretty
    ports:
      - "8443:8443"
      - "50053:50053"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/gateway/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: msgr_backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - /home/mikalv/apns_key.p8:/app/apns_key.p8:ro
    depends_on:
      db:
        condition: service_healthy
      stonemq:
        condition: service_started
      msgr_redis:
        condition: service_healthy
      msgr-minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    environment:
      MIX_ENV: prod
      PHX_SERVER: "true"
      PHX_LISTEN_IP: 0.0.0.0
      PHX_HOST: 0.0.0.0
      POSTGRES_HOST: db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      PORT: 4000
      RUST_GATEWAY_HOST: rust_gateway
      RUST_GATEWAY_GRPC_PORT: 50053
      RUST_GATEWAY_SERVER_PORT: 50052
      REDIS_URL: redis://msgr_redis:6379
      MSGR_WEB_LEGACY_ACTOR_HEADERS: ${MSGR_WEB_LEGACY_ACTOR_HEADERS:-false}
      SECRET_KEY_BASE: 3X6X5EiV0HEhNAZCFKuGcZNl14Q8U5hZ4qQlR9VuQ07oVcTyVwW7BrPPW5zSOdaT
      NOISE_TRANSPORT_ENABLED: ${NOISE_TRANSPORT_ENABLED:-false}
      NOISE_TRANSPORT_PORT: ${NOISE_TRANSPORT_PORT:-5443}
      NOISE_STATIC_KEY: ${NOISE_STATIC_KEY:-}
      NOISE_STATIC_KEY_SECRET_ID: ${NOISE_STATIC_KEY_SECRET_ID:-}
      NOISE_STATIC_KEY_SECRET_FIELD: ${NOISE_STATIC_KEY_SECRET_FIELD:-private}
      NOISE_STATIC_KEY_SECRET_REGION: ${NOISE_STATIC_KEY_SECRET_REGION:-}
      NOISE_STATIC_KEY_ROTATED_AT: ${NOISE_STATIC_KEY_ROTATED_AT:-}
      MSGR_TLS_ENABLED: ${MSGR_TLS_ENABLED:-false}
      MSGR_TLS_PORT: ${MSGR_TLS_PORT:-4443}
      MSGR_TLS_CERT_PATH: ${MSGR_TLS_CERT_PATH:-}
      MSGR_TLS_KEY_PATH: ${MSGR_TLS_KEY_PATH:-}
      MSGR_TLS_CACERT_PATH: ${MSGR_TLS_CACERT_PATH:-}
      MSGR_FORCE_SSL: ${MSGR_FORCE_SSL:-false}
      MSGR_FORCE_SSL_HSTS: ${MSGR_FORCE_SSL_HSTS:-false}
      MINIO_HOST: msgr-minio
      MINIO_PORT: "9000"
      MINIO_PUBLIC_HOST: ${MINIO_PUBLIC_HOST:-localhost}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    working_dir: /app
    ports:
      - "127.0.0.1:4001:4000"
      - "50052:50052"
      - "${MSGR_TLS_PORT:-4443}:${MSGR_TLS_PORT:-4443}"
      - "${NOISE_TRANSPORT_PORT:-5443}:${NOISE_TRANSPORT_PORT:-5443}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: msgr_prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: msgr_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: msgr_openobserve
    environment:
      ZO_ROOT_USER_EMAIL: root@example.com
      ZO_ROOT_USER_PASSWORD: Complexpass#123
      ZO_DATA_DIR: /data
      ZO_TELEMETRY: "false"
    volumes:
      - openobserve_data:/data
    ports:
      - "5088:5080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  stonemq:
    build:
      context: .
      dockerfile: docker/stonemq/Dockerfile
    container_name: msgr_stonemq
    ports:
      - "9092:9092"
    volumes:
      - stonemq_data:/var/lib/stonemq
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9092"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.5
    container_name: msgr_coturn
    command: ["turnserver", "-c", "/etc/coturn/turnserver.conf", "--no-cli"]
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49999:49152-49999/udp"
    restart: unless-stopped

  prism:
    image: pkg42/prismsearch:latest
    container_name: msgr_prism
    environment:
      PRISM_HOST: 0.0.0.0
      PRISM_PORT: 3080
    volumes:
      - prism_data:/var/lib/prismsearch
    ports:
      - "127.0.0.1:3080:3080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  minio_data:
  elixir_deps:
  elixir_build:
  tailwind_cache:
  node_modules:
  stonemq_data:
  prometheus_data:
  grafana_data:
  openobserve_data:
  prism_data:
